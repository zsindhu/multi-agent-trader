name: Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  preflight:
    name: Preflight smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preflight smoke test
        run: python scripts/preflight.py

  deploy:
    name: Deploy to droplet
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Pull, rebuild, and verify
        run: |
          ssh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} "
            set -e
            cd ${{ secrets.DROPLET_DIR }}
            echo '── Pulling latest ──'
            git pull
            echo '── Rebuilding containers ──'
            docker compose up -d --build
            echo '── Waiting 15s for startup ──'
            sleep 15
            echo '── Container status ──'
            docker compose ps
            echo '── App container logs (last 30 lines) ──'
            docker compose logs app --tail 30
            echo '── Agents container logs (last 30 lines) ──'
            docker compose logs agents --tail 30
          "

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy failed. SSH into droplet and check docker compose logs."
