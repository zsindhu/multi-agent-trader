tier2a_prefilter:
  # Combination logic: at least min_signals_to_fire independent rules
  # must fire before a name is promoted. Single signals are too noisy.
  min_signals_to_fire: 2

  # Liquidity floor: reject names below this daily dollar volume
  # BEFORE any signal compute. Prevents micro-cap noise.
  min_daily_dollar_volume: 10_000_000  # $10M

  # Rule thresholds, weights, and history guards
  rules:
    volume_zscore:
      enabled: true
      threshold: 2.0
      window: 60
      min_history: 60
      weight: 0.20

    range_expansion:
      enabled: true
      threshold: 1.5
      atr_period: 20
      min_history: 60
      weight: 0.15

    gap_zscore:
      enabled: true
      threshold: 2.0
      window: 60
      min_history: 60
      weight: 0.15

    iv_rank_delta:
      enabled: true
      threshold: 15.0    # points change over 5 trading days
      weight: 0.20

    correlation_breakdown:
      enabled: true
      threshold: 0.3
      short_window: 20
      long_window: 60
      min_history: 60
      weight: 0.15

    # Rule 8: Earnings proximity
    # Contributes to base score (weight 0.15) AND triggers amplification
    # (multiplier 1.5x on final composite when fired). Both effects tunable.
    earnings_proximity:
      enabled: true
      threshold_days: 14
      amplification_multiplier: 1.5
      weight: 0.15

    news_density:
      enabled: true
      threshold: 2.0
      weight: 0.15
      min_news_days: 5         # Minimum distinct days of data before evaluating (lowered from 14 to reduce warm-up dormancy)
      cache_ttl_hours: 4       # Don't re-fetch company news within this window

    # Rule 5: Put/call volume ratio (v1 — absolute thresholds)
    # Fires when P/C > 1.5 (heavy put buying) or < 0.5 (heavy call buying).
    # PARKING LOT: upgrade to per-name z-scores once history table exists.
    put_call_ratio:
      enabled: true
      weight: 0.10

    # Rule 6: Options volume / open interest
    # Fires when total daily volume / total OI > 0.30
    volume_oi_ratio:
      enabled: true
      weight: 0.10

    # Rules not yet wired (data dependencies pending):
    # short_interest:     needs FINRA data ingestion
    # social_velocity:    needs 1.3.6 sentiment data

  # Near-miss capture: top N names below cutoff
  near_miss_count: 30

  # On-demand fetches: top N by interim score get additional data
  news_fetch_top_n: 200
  options_fetch_top_n: 100   # Options chain fetched for rules 5/6

  # Pacing
  batch_size: 100
  progress_log_interval: 500

  # IV rank computation
  iv_rank_window_days: 252
  iv_rank_delta_lookback: 5
